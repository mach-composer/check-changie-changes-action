name: Release

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.type != 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Prepare release
      uses: labd/changie-release-action@059406879b04f6e073547b325fbbff9a573038e3 # v2.0.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

