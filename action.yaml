name: Check change File
description: Check if a new change file is set

inputs:
  pattern:
    description: 'Where to search for the change file. Can be a glob pattern'
    required: false
    default: '.changes/unreleased/**'

runs:
  using: "composite"
  steps:
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changes:
            - '${{ inputs.pattern }}'

    - name: Check changes
      if: steps.filter.outputs.changes == 'false'
      shell: bash
      run: |
        echo "No new change file set in ${INPUTS_PATTERN}"
        exit 1
      env:
        INPUTS_PATTERN: ${{ inputs.pattern }}